[package]
name = "patchgen"
version = "0.1.0"
edition = "2021"
description = "Generates bsdiff patches + deltas.json between two pureplayer releases"
publish = false

[dependencies]
qbsdiff = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
