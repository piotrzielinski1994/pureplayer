name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: v0.1.0
      releaseName:
        description: 'Release title (defaults to the tag)'
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch ffmpeg sidecars (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: |
          scripts/fetch-ffmpeg.sh aarch64-apple-darwin
          scripts/fetch-ffmpeg.sh x86_64-apple-darwin
          lipo -create \
            src-tauri/binaries/ffmpeg-aarch64-apple-darwin \
            src-tauri/binaries/ffmpeg-x86_64-apple-darwin \
            -output src-tauri/binaries/ffmpeg-universal-apple-darwin
          lipo -create \
            src-tauri/binaries/ffprobe-aarch64-apple-darwin \
            src-tauri/binaries/ffprobe-x86_64-apple-darwin \
            -output src-tauri/binaries/ffprobe-universal-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-universal-apple-darwin src-tauri/binaries/ffprobe-universal-apple-darwin

      - name: Fetch ffmpeg sidecars (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: scripts/fetch-ffmpeg.sh x86_64-pc-windows-msvc

      - name: Fetch ffmpeg sidecars (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: scripts/fetch-ffmpeg.sh x86_64-unknown-linux-gnu

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag }}
          releaseName: ${{ github.event.inputs.releaseName || github.event.inputs.tag }}
          releaseBody: 'Download the installer for your OS. Unsigned: on macOS right-click the app and choose Open; on Windows choose "More info -> Run anyway".'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # One job for every platform: the patches are plain bytes, so a single runner
  # can diff all artifacts, and there is exactly one writer of deltas.json (the
  # matrix jobs would otherwise race and clobber each other's manifest entries).
  deltas:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Find the previous published release
        id: previous
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          gh release list --exclude-drafts --limit 20 --json tagName \
            --jq '.[].tagName' | grep -v -x "$TAG" | head -n 1 > previous-tag.txt
          echo "tag=$(cat previous-tag.txt)" >> "$GITHUB_OUTPUT"

      - name: Fetch the previous release artifacts
        if: steps.previous.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.previous.outputs.tag }}" --dir previous --clobber
          gh release download "${{ github.event.inputs.tag }}" --dir current --clobber

      - name: Generate delta patches
        if: steps.previous.outputs.tag != ''
        run: |
          cargo run --release --manifest-path src-tauri/patchgen/Cargo.toml -- \
            --old previous \
            --new current \
            --out deltas

      - name: Upload delta patches
        if: steps.previous.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if compgen -G "deltas/*" > /dev/null; then
            gh release upload "${{ github.event.inputs.tag }}" deltas/* --clobber
          else
            echo "no patches generated"
          fi
